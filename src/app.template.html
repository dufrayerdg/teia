<style>
:root{--bg:#F8F6FE;--card:#fff;--ink:#1F1B4B;--navy:#5B2EE8;--indigo:#6B45EE;--sol:#E9DDB8;--muted:#6E6A8C;--soft:#F1EDFB;--line:#ECE7F8;--r:18px;
--sh:0 1px 2px rgba(70,50,160,.04),0 8px 24px rgba(70,50,160,.07);--alerta:#9A3412}
*{box-sizing:border-box}
html,body{margin:0;background:#EEEAF8;color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
a{color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#FFFFFF 0%,#F8F5FE 45%,#EEE8FB 100%);background-attachment:local;position:relative;padding-bottom:128px;overflow-x:clip}
.app>*{position:relative;z-index:1}
h1,h2,h3,p{margin:0}
h1{font-size:23px;font-weight:600;letter-spacing:-.5px;line-height:1.12}
h2{font-size:16.5px;font-weight:600;letter-spacing:-.3px}
h3{font-size:14px;font-weight:600}
.wrap{padding:18px 18px 0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}.xs{font-size:10.5px}.b{font-weight:600}
.num{font-weight:600;letter-spacing:-1px;line-height:1}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.tile{position:relative;overflow:hidden;border-radius:var(--r);padding:14px;box-shadow:var(--sh);isolation:isolate}
.tile>*{position:relative;z-index:1}
.au-indigo{color:#fff;background:linear-gradient(125deg,#7C58F0 0%,#5B2EE8 55%,#3B1AA8 100%);border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 28px -14px rgba(59,26,168,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.au-indigo:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;background:linear-gradient(112deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.05) 38%,rgba(255,255,255,0) 60%)}
.au-sol{background:#EFEAFB}
.au-ceu{background:#E8E4FA}
.au-rosa{background:#F3EBF7}
.au-menta{background:#E9EFF6}
.au-lilas{background:#ECE7FA}
.hero{width:100%;text-align:left;cursor:pointer;padding:13px 16px 14px;border-radius:20px;display:block;font-family:inherit}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;font-weight:500;opacity:.82}
.hero-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
.hero-t{font-size:19px;font-weight:500;letter-spacing:-.4px;line-height:1.15}
.hero-pct{font-size:34px;font-weight:300;letter-spacing:-1.5px;line-height:1}
.hero-track{height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin-top:10px;overflow:hidden}
.hero-track i{display:block;height:100%;border-radius:2px;background:#fff}
.hero-foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;opacity:.88;margin-top:7px}
.hd{display:flex;align-items:center;gap:12px;padding:22px 18px 4px}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#E3DAFA,#C8BAF0);color:var(--navy);font-weight:600;font-size:19px;box-shadow:0 0 0 3px #fff}
.hello{font-size:20.5px;font-weight:600;letter-spacing:-.6px;line-height:1.1}
.qts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qt{border:none;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;text-align:left;color:var(--ink);min-height:0}
.qt .qi{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#EEE8FC,#DDD2F8);display:flex;align-items:center;justify-content:center;flex:none;color:var(--navy)}
.cat{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 18px 4px;margin:0 -18px}
.cat::-webkit-scrollbar{display:none}
.cat button{flex:none;height:32px;padding:0 14px;border-radius:16px;border:1px solid #E5DEF6;background:#fff;font-size:12.5px;font-weight:500;color:var(--muted)}
.cat button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.art{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:none;border-radius:14px;padding:10px 12px;box-shadow:var(--sh);color:var(--ink)}
.art .th{width:44px;height:44px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#7C58F0,#5B2EE8)}
.art .t{font-size:13.5px;font-weight:500;line-height:1.3}
.art .m{font-size:11.5px;color:var(--muted);margin-top:3px}
.art .sb{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .m{margin-top:5px!important}
.pil{background:var(--f);color:var(--t);display:inline-block;font-size:10px;font-weight:500;letter-spacing:.2px;padding:2px 9px;border-radius:999px;line-height:1.4}
.secao{font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.minis{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 4px;scroll-padding:0 18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.minis::-webkit-scrollbar{display:none}
.mini{background:var(--f);flex:none;width:128px;scroll-snap-align:start;border:none;border-radius:14px;padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;font-family:inherit;color:var(--ink);cursor:pointer}

.btn{height:auto;min-height:46px;padding-top:8px;padding-bottom:8px;line-height:1.25;text-align:center}.btn svg{flex:none}
.chip{height:auto;min-height:38px;padding:8px 16px;line-height:1.3;text-align:left}
@media (max-width:374px){.chips.dias{display:grid;grid-template-columns:repeat(4,1fr)}.btn svg{display:none}.qa .btn{padding:0 6px;font-size:12.5px}}
@media (max-width:374px){.chips.dias .opt{flex:none}}.qa .btn{padding:0 8px;gap:6px;font-size:13px;height:auto;min-height:44px}
/* seletor de dia e hora: campos com lista suspensa */
.pk{display:flex;flex-direction:column;gap:8px}
.pk-l{font-size:11px;font-weight:600;margin-bottom:-4px}.pk-l em{font-style:normal;font-weight:500;color:var(--muted)}
.pk3{display:grid;grid-template-columns:.85fr 1fr 1.15fr;gap:8px}
.pk2{display:flex;align-items:center;gap:8px}.pk2 .pkf{flex:1}
.pk-dp{font-size:18px;font-weight:600;color:var(--muted)}
.pkf{position:relative;height:50px;border-radius:14px;border:1px solid rgba(20,20,40,.07);background:rgba(255,255,255,.9);font-family:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;padding:0 26px 0 12px;cursor:pointer;text-align:left;min-width:0}
.pkf small{font-size:9.5px;font-weight:500;color:var(--muted);line-height:1}
.pkf b{font-size:15px;font-weight:600;line-height:1.1}
.pkf:after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.pkf.aberto{border-color:var(--navy);box-shadow:0 0 0 3px rgba(91,46,232,.12)}
.pkpop{position:fixed;z-index:90;overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 18px 44px -12px rgba(22,23,58,.4),0 0 0 1px rgba(20,20,40,.06);padding:4px;overscroll-behavior:contain;scroll-snap-type:y proximity;-webkit-overflow-scrolling:touch;animation:pkabre .14s ease-out}
@keyframes pkabre{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pkpop button{display:block;width:100%;height:40px;border:none;background:none;border-radius:11px;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;scroll-snap-align:center;padding:0}

.bv{min-height:calc(100vh - 20px);display:flex;flex-direction:column;padding:28px 22px 24px}
.bv-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:20px 0}
/* ===== variação: fundo blur claro + cards brancos/cinzas ===== */
html,body{background:#fff}
.app{background:#fff !important;overflow:hidden}
.app:before{content:"";position:absolute;inset:-120px -160px auto -160px;height:1100px;z-index:0;pointer-events:none;
 background:
  radial-gradient(38% 30% at 18% 14%,#E2D8FF 0%,rgba(233,226,255,0) 100%),
  radial-gradient(34% 26% at 86% 8%,#FFDDD2 0%,rgba(255,230,222,0) 100%),
  radial-gradient(40% 30% at 78% 42%,#D6ECFF 0%,rgba(223,241,255,0) 100%),
  radial-gradient(36% 28% at 14% 58%,#DAF3E6 0%,rgba(227,246,236,0) 100%);
 filter:blur(40px);opacity:.95}
.app>*{position:relative;z-index:1}
.au-indigo,.hero{background:rgba(255,255,255,.82) !important;color:var(--ink) !important;border:1px solid rgba(20,20,40,.06) !important;
 box-shadow:0 1px 2px rgba(20,20,40,.04),0 10px 30px -12px rgba(20,20,40,.12) !important;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.au-indigo:before{display:none !important}
.hero-top,.hero-foot{opacity:1 !important;color:var(--muted)}
.hero-track{background:#ECECF0 !important}.hero-track i{background:var(--navy) !important}
.hero-pct{color:var(--navy)}
.bn{background:var(--navy) !important;color:#fff !important;box-shadow:none !important}
.bn.g{background:#F1F1F4 !important;color:var(--ink) !important}
.au-sol,.au-ceu,.au-rosa,.au-menta,.au-lilas{background:#F4F4F6 !important}
.card,.list,.qt,.art,.dc,.pc,.empty,.week,.seg,.meta-grid div,.input,.chip,.opt span,.notacard,.bubble.ai{background:rgba(255,255,255,.88) !important;border:1px solid rgba(20,20,40,.05);box-shadow:0 1px 2px rgba(20,20,40,.03),0 8px 24px -14px rgba(20,20,40,.14) !important}
.qt .qi,.dc .th,.art .th,.ib{background:#F2F2F5 !important;color:var(--ink) !important}
.art .th{color:var(--navy) !important}
.tg,.tag{background:#F2F2F5 !important;color:#4A4A5A !important}
.cat button{background:#fff;border-color:#EAEAEE}
.av{background:#F2F2F5 !important;color:var(--ink) !important}
.dock{background:rgba(255,255,255,.85) !important}


.plan{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.9);border:1.5px solid #E6E3EE;border-radius:16px;padding:12px 14px;font-family:inherit;color:var(--ink);position:relative}
.plan.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(91,46,232,.12)}
.plan .rd{width:20px;height:20px;border-radius:50%;border:2px solid #CFCADF;flex:none;display:flex;align-items:center;justify-content:center}
.plan.on .rd{border-color:var(--navy)}.plan.on .rd:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--navy)}
.plan .badge{position:absolute;top:-9px;right:12px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:8px}
.plus-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;letter-spacing:.2px}
.uso{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:10px}
.uso .bar{flex:1;height:4px}
.pessoas{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 18px 2px}.pessoas::-webkit-scrollbar{display:none}
.pessoa{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 5px;border-radius:19px;border:1px solid #E6E3EE;background:rgba(255,255,255,.88);font-family:inherit;font-size:13px;font-weight:500;color:var(--ink)}
.pessoa .pa{width:28px;height:28px;border-radius:50%;background:#F1EDFF;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.pessoa.on{background:var(--navy);border-color:var(--navy);color:#fff}.pessoa.on .pa{background:rgba(255,255,255,.22);color:#fff}
.pessoa.add{padding:0 12px;gap:6px;color:var(--navy);border-style:dashed}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0}
.cal button{aspect-ratio:1/1.05;border:none;border-radius:12px;background:rgba(255,255,255,.75);font-family:inherit;color:var(--ink);font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cal button.fora{opacity:.35}.cal button.hoje{box-shadow:inset 0 0 0 1.5px var(--navy)}.cal button.sel{background:var(--navy);color:#fff}
.cal .pts{display:flex;gap:2px;height:5px}.cal .pts i{width:5px;height:5px;border-radius:50%}
.pt-consulta{background:#5B2EE8}.pt-terapia{background:#9C82F5}.pt-receita{background:#F5A524}.pt-marco{background:#4FC3A1}
.cal button.sel .pts i{box-shadow:0 0 0 1px #fff}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted)}.legenda span{display:inline-flex;align-items:center;gap:5px}.legenda i{width:8px;height:8px;border-radius:50%;display:inline-block}
.marcos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.marco{border:none;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh);text-align:left;font-family:inherit;color:var(--ink);padding:0}
.marco .ft{aspect-ratio:4/3;background:linear-gradient(135deg,#EFE9FF,#DCD2FA);display:flex;align-items:center;justify-content:center;color:var(--navy)}
.marco .ft img{width:100%;height:100%;object-fit:cover;display:block}
.marco .tx{padding:10px 12px}.marco b{display:block;font-size:13px;font-weight:600;line-height:1.3}.marco small{font-size:11px;color:var(--muted)}
.crise-extra{display:none}
form:has(input[name="crise"][value="Sim"]:checked) .crise-extra{display:flex}
.hoje-card{display:flex;flex-direction:column;gap:8px}
.hoje-it{display:flex;align-items:center;gap:10px;font-size:13px}
.hoje-it .ib{width:30px;height:30px}
.festa{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.festa i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:cai 2s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes cai{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.resp{margin-top:8px;padding:8px 10px;border-radius:10px;background:#F4F1FD;font-size:12.5px;line-height:1.45;color:#3A3566}
.empty{padding:30px 20px 24px;position:relative;overflow:hidden}
.empty>.ib:first-child{width:64px!important;height:64px!important;border-radius:22px!important;background:linear-gradient(135deg,#F3EEFF,#E2D8FC)!important;color:var(--navy)!important;box-shadow:0 10px 24px -12px rgba(91,46,232,.45)!important;position:relative}
.empty>.ib:first-child svg{width:28px;height:28px}
.empty:before{content:"";position:absolute;left:50%;top:18px;width:120px;height:90px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(156,130,245,.18),transparent);pointer-events:none}
.tour{min-height:calc(100vh - 20px);display:flex;flex-direction:column;padding:26px 22px 24px;gap:14px}
.tour .pg{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.tour .big{width:96px;height:96px;border-radius:30px;background:linear-gradient(135deg,#F3EEFF,#DCD0FA);display:flex;align-items:center;justify-content:center;color:var(--navy);box-shadow:0 18px 36px -18px rgba(91,46,232,.6)}
.tour .big svg{width:44px;height:44px}
.tour .dots{justify-content:center}
.rel{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--sh);font-size:13px;line-height:1.5;color:#1F1B3A}
.rel h3{font-size:13px;font-weight:700;margin:16px 0 6px;color:var(--navy);text-transform:uppercase;letter-spacing:.6px}
.rel table{width:100%;border-collapse:collapse}.rel td{padding:5px 0;border-bottom:1px solid #EEE;vertical-align:top}.rel td:first-child{color:#6E6A8C;width:38%;padding-right:8px}
.rel ul{margin:4px 0;padding-left:18px}
@media print{html,body{background:#fff!important}.app{background:#fff!important;padding:0!important}.app:before,.dock-wrap,.top,.noprint,.toast,.banner,#layer{display:none!important}.rel{box-shadow:none!important;padding:0!important}.wrap{padding:0!important}@page{margin:14mm}}
/* modo escuro */
html.escuro,html.escuro body{background:#0F0D18!important;color:#ECE9F7}
html.escuro{--ink:#ECE9F7;--muted:#A9A3C6;--soft:#221E33;--line:#2B2640;--card:#1A1727}
html.escuro .app{background:linear-gradient(180deg,#14111F 0%,#120F1C 100%)!important}
html.escuro .app:before{opacity:.18}
html.escuro .card,html.escuro .list,html.escuro .qt,html.escuro .art,html.escuro .dc,html.escuro .pc,html.escuro .empty,html.escuro .week,html.escuro .seg,html.escuro .meta-grid div,html.escuro .input,html.escuro .chip,html.escuro .opt span,html.escuro .notacard,html.escuro .bubble.ai,html.escuro .au-indigo,html.escuro .hero,html.escuro .marco,html.escuro .plan,html.escuro .pessoa,html.escuro .cat button,html.escuro .cal button,html.escuro .rel{background:rgba(30,26,46,.92)!important;color:var(--ink)!important;border-color:#2E2944!important;box-shadow:none!important}
html.escuro .au-sol,html.escuro .au-ceu,html.escuro .au-rosa,html.escuro .au-menta,html.escuro .au-lilas{background:#1E1A2E!important}
html.escuro .ib,html.escuro .qt .qi,html.escuro .dc .th,html.escuro .art .th,html.escuro .tg,html.escuro .tag,html.escuro .av,html.escuro .resp{background:#2A2540!important;color:#C9BCFF!important}
html.escuro .dock,html.escuro .composer{background:rgba(24,21,38,.95)!important}
html.escuro .sheet{background:#17142A!important}
html.escuro .circle{background:#221E33!important;color:var(--ink)!important}
html.escuro .opt input:checked+span,html.escuro .chip.on,html.escuro .cat button.on,html.escuro .pessoa.on,html.escuro .day.on,html.escuro .seg button.on,html.escuro .cal button.sel{background:#7B5CF5!important;color:#fff!important}
html.escuro .btn.sec,html.escuro .btn.danger,html.escuro .bn.g{background:#221E33!important;color:var(--ink)!important}
html.escuro .muted,html.escuro .note,html.escuro .xs.muted{color:var(--muted)!important}
html.escuro .hero-track,html.escuro .bar{background:#2B2640!important}
html.escuro .prose p,html.escuro .prose ul{color:#D9D4EE}
html.escuro .rel td{border-color:#2E2944}html.escuro .rel h2{color:var(--ink)}
html.escuro .banner{background:#3A2A12;color:#F7C77B}
/* estados selecionados e textos claros sobre cards agora brancos */
.opt input:checked+span,.chip.on{background:var(--navy) !important;color:#fff !important;border-color:var(--navy) !important;box-shadow:0 6px 14px -6px rgba(91,46,232,.5) !important}
.opt input:checked+span svg{color:#fff}
.au-indigo .pill-tag{background:#F1EDFF !important;color:var(--navy) !important}
.au-indigo .circle,.glass{background:#fff !important;color:var(--ink) !important;box-shadow:var(--sh) !important}
.steps i{background:#E4E1EE !important}.steps i.on{background:var(--navy) !important}
</style>

TELAS.evolucao = (p) => {
  const trat = S.trat.items; const sel = p.id && trat.find(t => t.id === p.id) ? p.id : "geral"; const t = trat.find(x => x.id === sel);
  const regs = S.regs.items.filter(r => sel === "geral" || r.tratId === sel).sort((a, b) => b.data.localeCompare(a.data));
  const hoje = new Date(); const ini = addDays(hoje, -27); const porDia = {}; for (const r of S.regs.items) porDia[r.data] = Math.max(porDia[r.data] || 0, r.humor || 0);
  const cores = ["#E6E6E2","#D9D9E6","#B7B9D6","#8E91C2","#5D60A6","#2F3273"];
  const bons = Object.entries(porDia).filter(([d, h]) => d >= iso(ini) && h >= 4).length;
  return `${topo("Evolução")}
<div class="wrap stack" style="padding-top:12px;gap:14px">
  <div class="seg" role="group" aria-label="Escolher terapia"><button class="${sel === "geral" ? "on" : ""}" data-a="evo" data-id="geral" aria-pressed="${sel === "geral"}">Geral</button>${trat.map(x => `<button class="${sel === x.id ? "on" : ""}" data-a="evo" data-id="${x.id}" aria-pressed="${sel === x.id}">${esc(curto(x.tipo))}</button>`).join("")}</div>
  ${t ? `<div class="tile au-indigo"><div class="row"><span class="pill-tag">Meta atual</span><span class="grow"></span><button class="circle" data-a="trat-editar" data-id="${t.id}" aria-label="Atualizar meta" style="width:40px;height:40px">${ic("editar", 18)}</button></div><p class="b" style="font-size:17px;margin-top:12px">${esc(t.meta || "Sem meta definida")}</p><div class="row" style="align-items:flex-end;margin-top:12px"><p class="num" style="font-size:38px">${t.progresso || 0}%</p><p class="small grow" style="opacity:.9;margin-bottom:6px">do caminho</p></div><div class="bar" style="background:rgba(255,255,255,.25);margin-top:10px" role="progressbar" aria-valuenow="${t.progresso || 0}" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso da meta"><span style="width:${t.progresso || 0}%;background:#F9DF77"></span></div></div>` : ""}
  <div class="card"><div class="row"><div class="grow"><p class="xs b muted">Últimas 4 semanas</p><p class="b" style="font-size:15.5px">${bons} ${bons === 1 ? "dia bom" : "dias bons"}</p></div><span class="xs muted">por humor registrado</span></div>
    <div role="img" aria-label="Humor registrado nos últimos 28 dias: ${bons} dias bons" style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px">${Array.from({length: 28}, (_, i) => { const dI = iso(addDays(ini, i)); const h = porDia[dI] || 0; return `<span style="aspect-ratio:1;border-radius:50%;background:${cores[h]};${dI === iso(hoje) ? "outline:2px solid #1B1C3A;outline-offset:2px" : ""}"></span>`; }).join("")}</div>
    <div class="row xs muted" style="gap:10px;margin-top:12px;flex-wrap:wrap">${[[1,"Difícil"],[3,"Ok"],[5,"Ótimo"],[0,"Sem registro"]].map(([h, l]) => `<span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:50%;background:${cores[h]};display:inline-block"></i>${l}</span>`).join("")}</div></div>
  <div class="row" style="gap:10px"><button class="qt grow" data-a="ir" data-v="crises"><span class="qi">${ic("crise", 18)}</span><span>Crises e padrões</span></button><button class="qt grow" data-a="ir" data-v="marcos"><span class="qi">${ic("conquista", 18)}</span><span>Marcos</span></button></div>
  <div class="sec-title"><h2>Registros</h2><button class="link" data-a="ir" data-v="registro">Registrar</button></div>
  ${regs.length ? regs.slice(0, 12).map(r => `<div class="list"><span class="ib c2" aria-hidden="true">${ic(HUMOR[(r.humor || 3) - 1][0], 22)}</span><div class="grow"><p class="small b">${esc(r.conquista || r.nota || HUMOR[(r.humor || 3) - 1][1])}</p><p class="xs muted">${fmtData(r.data)} · sono ${esc((r.sono || "").toLowerCase())}${r.crise ? " · teve crise" : ""}</p></div><button class="circle" data-a="reg-apagar" data-id="${r.id}" aria-label="Apagar registro" style="width:40px;height:40px;box-shadow:none;background:var(--soft)">${ic("lixo", 18)}</button></div>`).join("")
    : `<div class="empty"><span class="ib c3" style="margin:0 auto 10px">${ic("diario", 22)}</span><p class="b">Ainda sem registros</p><p class="small muted" style="margin-top:4px">Registre o dia em 30 segundos.</p></div>`}

};

TELAS.linha = () => {
  const ev = [];
  for (const d of S.docs.items) { const t = TIPOS_DOC[d.tipo] || TIPOS_DOC.outro; ev.push({ data: d.data || (d.criadoEm || "").slice(0, 10), t: `${t[0]} adicionado`, s: d.titulo || "", i: t[1], c: "c5", a: `data-a="doc-abrir" data-id="${d.id}"` }); }
  for (const r of S.regs.items) if (r.conquista) ev.push({ data: r.data, t: "Nova conquista!", s: r.conquista, i: "conquista", c: "c1", tile: "au-sol" });
  for (const [dI, mapa] of Object.entries(S.checks.d)) for (const k of Object.keys(mapa)) if (k.startsWith("trat:")) { const t = S.trat.items.find(x => x.id === k.slice(5)); if (t) ev.push({ data: dI, t: `${curto(t.tipo)} realizada`, s: `Marcado por ${mapa[k].by}`, i: "feito", c: "c3" }); }
  for (const c of S.consultas.items) ev.push({ data: c.data, t: `Consulta: ${c.titulo}`, s: [c.hora, c.profissional, c.local].filter(Boolean).join(" · "), i: "consulta", c: "c5" });
  for (const x of S.marcos.items) ev.push({ data: x.data, t: "Marco: " + x.titulo, s: x.nota || "", i: "conquista", c: "c1", tile: "au-sol" });
  for (const m of S.meds.items) if (m.inicio) ev.push({ data: m.inicio, t: "Remédio na rotina", s: m.nome, i: "medicacao", c: "c4" });
  ev.sort((a, b) => (b.data || "").localeCompare(a.data || "")); let dia = "";
  return `${topo("Linha do tempo")}<div class="wrap stack" style="padding-top:12px">
  ${ev.length ? ev.slice(0, 60).map(e => { const cab = e.data !== dia ? `<p class="small b" style="margin-top:8px">${e.data === iso(new Date()) ? "Hoje" : esc(fmtLonga(e.data))}</p>` : ""; dia = e.data; const tag = e.a ? "button" : "div"; return `${cab}<${tag} class="${e.tile ? "tile " + e.tile + " row" : "list"}" style="${e.tile ? "border:none;width:100%;text-align:left" : ""}" ${e.a || ""}><span class="ib ${e.c}" ${e.tile ? 'style="background:rgba(255,255,255,.6)"' : ""}>${ic(e.i, 20)}</span><span class="grow"><b class="small" style="display:block">${esc(e.t)}</b><span class="xs ${e.tile ? "" : "muted"}">${esc(e.s)}</span></span></${tag}>`; }).join("")
    : `<div class="empty"><span class="ib c4" style="margin:0 auto 10px">${ic("linha", 22)}</span><p class="b">A linha do tempo começa agora</p><p class="small muted" style="margin-top:4px">Documentos, sessões e conquistas aparecem aqui.</p></div>`}</div>`;
};

async function reduzirImagem(file) { try { const b = await createImageBitmap(file); const k = Math.min(1, 1600 / Math.max(b.width, b.height)); const c = document.createElement("canvas"); c.width = Math.round(b.width * k); c.height = Math.round(b.height * k); c.getContext("2d").drawImage(b, 0, 0, c.width, c.height); return await new Promise(r => c.toBlob(x => r(x || file), "image/jpeg", .85)); } catch (e) { return file; } }

    const pg = await doc.getPage(i); const v1 = pg.getViewport({ scale: 1 }); const vp = pg.getViewport({ scale: Math.min(2.4, 1600 / v1.width) });
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height); const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);

async function gerarRelatorio(btn) {
  const out = document.getElementById("relout"); if (!out) return;
  if (!SAMPLE) { out.innerHTML = `<p class="banner">O resumo da teIA não está disponível nesta visualização.</p>`; return; }
  const ref = new Date(), mes = `${ref.getFullYear()}-${pad(ref.getMonth() + 1)}`;
  const regs = S.regs.items.filter(r => r.data.startsWith(mes)).map(r => ({ data: r.data, humor: HUMOR[(r.humor || 3) - 1][1], sono: r.sono, crise: r.crise, conquista: r.conquista, nota: r.nota, terapia: (S.trat.items.find(t => t.id === r.tratId) || {}).tipo }));
  const sess = S.trat.items.map(t => ({ terapia: t.tipo, ...sessoesMes(t), meta: t.meta, progresso: t.progresso }));
  if (!regs.length && !sess.length) { out.innerHTML = `<p class="banner">Registre alguns dias ou cadastre tratamentos para gerar o resumo.</p>`; return; }
  btn.disabled = true; out.innerHTML = `<div class="card stack" style="gap:12px"><p id="reltxt" class="small" style="white-space:pre-wrap;line-height:1.5">Escrevendo o resumo…</p><button class="btn sec" data-a="copiar">Copiar resumo</button></div>`;
  const prompt = `Escreva em português do Brasil um resumo curto (até 170 palavras) do mês de ${MESES[ref.getMonth()]} de ${nomeCrianca()}, para ${nomeUsuario() || "a família"} levar aos profissionais. Tom acolhedor e objetivo. Organize em: Presença nas terapias; Como foram os dias; Conquistas; Pontos para conversar. Sem diagnósticos nem recomendações clínicas. Use só os dados abaixo.\nSessões: ${JSON.stringify(sess)}\nRegistros: ${JSON.stringify(regs)}`;
  try { const r = await SAMPLE(prompt, { modelTier: "default", onText: ({ text }) => { const el = document.getElementById("reltxt"); if (el) el.textContent = text; } }); const el = document.getElementById("reltxt"); if (el && r.text) el.textContent = r.text; }
  catch (err) { out.innerHTML = `<p class="banner">${err && err.code === "rate_limited" ? "Muitos pedidos seguidos. Tente em alguns minutos." : "Não consegui gerar o resumo agora."}</p>`; }
  btn.disabled = false;
}

    if (tipo === "med") { const id = f.dataset.id; S.meds.items = S.meds.items.map(m => m.id === id ? { ...m, nome: g("nome"), dose: g("dose"), horarios: lerHorarios(g("horarios")), inicio: g("inicio"), fim: g("fim"), estoque: g("estoque") === "" ? "" : Number(g("estoque")), porTomada: Number(g("porTomada") || 1) } : m); await salvar("meds").catch(() => {}); voltar(); toast("Remédio atualizado."); }
    if (tipo === "nota") { addItem("notas", { id: uid(), data: iso(new Date()), titulo: g("titulo"), texto: g("texto"), para: g("para"), feito: false, origem: "manual" }); fecharSheet(); render(); await salvar("notas").catch(() => {}); toast("Anotação salva."); }
    if (tipo === "consulta") { const item = { titulo: g("titulo"), data: g("data"), hora: g("hora"), profissional: g("profissional"), local: g("local"), obs: g("obs") }; const cid = f.dataset.id;
      if (cid) S.consultas.items = S.consultas.items.map(x => x.id === cid ? { ...x, ...item } : x); else addItem("consultas", { id: uid(), ...item });
      fecharSheet(); render(); await salvar("consultas").catch(() => {}); toast(cid ? "Consulta atualizada." : `Consulta marcada para ${fmtData(item.data).slice(0, 5)}${item.hora ? " às " + item.hora : ""}.`); }
    if (tipo === "repor") { const mid = f.dataset.id, q = Number(g("qtd") || 0); S.meds.items = S.meds.items.map(m => m.id === mid ? { ...m, estoque: Number(m.estoque || 0) + q } : m); fecharSheet(); render(); await salvar("meds").catch(() => {}); toast("Estoque atualizado."); }
    if (tipo === "marco") { const arq = f.querySelector('input[name="foto"]').files[0]; let foto = ""; if (arq) { try { const red = await reduzirImagem(arq).catch(() => null); const arqFinal = red ? new File([red], (arq.name || "foto").replace(/\.[^.]+$/, "") + ".jpg", { type: red.type || "image/jpeg" }) : arq; const ids = await guardarArquivos([arqFinal]); foto = ids[0] || ""; } catch (er) { toast("Não consegui guardar a foto."); } }
      addItem("marcos", { id: uid(), titulo: g("titulo"), data: g("data"), nota: g("nota"), foto }); fecharSheet(); await salvar("marcos").catch(() => {}); go("marcos", {}, TELA.nome === "marcos"); festa(`Marco de ${nomeCrianca()} guardado!`); }
    if (tipo === "nota-resposta") { const nid = f.dataset.id; S.notas.items = S.notas.items.map(n => n.id === nid ? { ...n, resposta: g("resposta"), respondidaEm: iso(new Date()), feito: true } : n); fecharSheet(); render(); await salvar("notas").catch(() => {}); toast("Resposta guardada."); }
    if (tipo === "conta-email" || tipo === "entrar-email") { if (!NUVEM.entrarEmail) { soNoApp(); return; } const r = await NUVEM.entrarEmail(g("email").toLowerCase(), tipo === "conta-email").catch(e => (e && e.message) || "erro"); toast(r === true ? (tipo === "conta-email" ? "Confira seu e-mail para confirmar. Seus dados continuam aqui." : "Enviamos um link. Abra no celular para entrar.") : "Não consegui enviar agora. Confira o e-mail."); }
    if (tipo === "aceitar-convite") { if (!NUVEM.aceitarConvite) { soNoApp(); return; } const r = await NUVEM.aceitarConvite(g("codigo").trim().toUpperCase()).catch(e => (e && e.message) || "erro"); if (r === true) { toast("Pronto! Agora você cuida junto."); } else toast(typeof r === "string" && r.length < 80 ? r : "Código inválido ou vencido."); }
    if (tipo === "tarefa") { addItem("tarefas", { id: uid(), titulo: g("titulo"), dias: fd.getAll("dias").map(Number), hora: g("hora") }); fecharSheet(); await salvar("tarefas").catch(() => {}); go("rotina", {}, true); toast("Tarefa adicionada."); }
    if (tipo === "rede") { S.rede.items.push({ id: uid(), nome: g("nome"), papel: g("papel"), contato: g("contato"), obs: g("obs") }); fecharSheet(); render(); salvar("rede").catch(() => {}); toast("Pessoa adicionada."); }
    if (tipo === "chat") { const q = g("q"); if (q) perguntar(q); }
  } finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
});
