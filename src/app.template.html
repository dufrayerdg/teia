<style>
:root{--bg:#F8F6FE;--card:#fff;--ink:#1F1B4B;--navy:#5518FB;--indigo:#6B3BFF;--sol:#E9DDB8;--muted:#6E6A8C;--soft:#F1EDFB;--line:#ECE7F8;--r:18px;
--sh:0 1px 2px rgba(70,50,160,.04),0 8px 24px rgba(70,50,160,.07);--alerta:#9A3412}
*{box-sizing:border-box}
html,body{margin:0;background:#EEEAF8;color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
a{color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#FFFFFF 0%,#F8F5FE 45%,#EEE8FB 100%);background-attachment:local;position:relative;padding-bottom:128px;overflow-x:clip}
.app>*{position:relative;z-index:1}
h1,h2,h3,p{margin:0}
h1{font-size:23px;font-weight:600;letter-spacing:-.5px;line-height:1.12}
h2{font-size:16.5px;font-weight:600;letter-spacing:-.3px}
h3{font-size:14px;font-weight:600}
.wrap{padding:18px 18px 0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}.xs{font-size:10.5px}.b{font-weight:600}
.num{font-weight:600;letter-spacing:-1px;line-height:1}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.tile{position:relative;overflow:hidden;border-radius:var(--r);padding:14px;box-shadow:var(--sh);isolation:isolate}
.tile>*{position:relative;z-index:1}
.au-indigo{color:#fff;background:linear-gradient(125deg,#7A4BFF 0%,#5518FB 55%,#3A0DBF 100%);border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 28px -14px rgba(58,13,191,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.au-indigo:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;background:linear-gradient(112deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.05) 38%,rgba(255,255,255,0) 60%)}
.au-sol{background:#EFEAFB}
.au-ceu{background:#E8E4FA}
.au-rosa{background:#F3EBF7}
.au-menta{background:#E9EFF6}
.au-lilas{background:#ECE7FA}
.hero{width:100%;text-align:left;cursor:pointer;padding:13px 16px 14px;border-radius:20px;display:block;font-family:inherit}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;font-weight:500;opacity:.82}
.hero-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
.hero-t{font-size:19px;font-weight:500;letter-spacing:-.4px;line-height:1.15}
.hero-pct{font-size:34px;font-weight:300;letter-spacing:-1.5px;line-height:1}
.hero-track{height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin-top:10px;overflow:hidden}
.hero-track i{display:block;height:100%;border-radius:2px;background:#fff}
.hero-foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;opacity:.88;margin-top:7px}
.hd{display:flex;align-items:center;gap:12px;padding:22px 18px 4px}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#E3DAFA,#C8BAF0);color:var(--navy);font-weight:600;font-size:19px;box-shadow:0 0 0 3px #fff}
.hello{font-size:20.5px;font-weight:600;letter-spacing:-.6px;line-height:1.1}
.qts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qt{border:none;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;text-align:left;color:var(--ink);min-height:0}
.qt .qi{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#EEE8FC,#DDD2F8);display:flex;align-items:center;justify-content:center;flex:none;color:var(--navy)}
.cat{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 18px 4px;margin:0 -18px}
.cat::-webkit-scrollbar{display:none}
.cat button{flex:none;height:32px;padding:0 14px;border-radius:16px;border:1px solid #E5DEF6;background:#fff;font-size:12.5px;font-weight:500;color:var(--muted)}
.cat button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.art{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:none;border-radius:14px;padding:10px 12px;box-shadow:var(--sh);color:var(--ink)}
.art .th{width:44px;height:44px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#7A4BFF,#5518FB)}
.art .t{font-size:13.5px;font-weight:500;line-height:1.3}
.art .m{font-size:11.5px;color:var(--muted);margin-top:3px}
.dc{display:flex;gap:12px;width:100%;text-align:left;background:#fff;border:none;border-radius:14px;padding:12px;box-shadow:var(--sh);color:var(--ink);align-items:flex-start;font-family:inherit}
.dc .th{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EEE8FC,#DDD2F8);color:var(--navy)}
.dc .tt{font-size:13.5px;font-weight:500;line-height:1.3}
.dc .mm{font-size:11.5px;color:var(--muted);margin-top:2px}
.dc .sn{font-size:12px;color:#4A466E;margin-top:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tg{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;font-size:10.5px;font-weight:500;background:#F0EBFB;color:var(--navy)}
.tgs{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.nota{display:flex;align-items:flex-start;gap:10px}
.nota.feita{opacity:.55}
.notacard{align-self:flex-start;max-width:90%;display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1px solid #E5DEF6;border-radius:14px;padding:10px 12px;box-shadow:var(--sh);font-family:inherit;color:var(--ink)}
.notacard b{display:block;font-size:12px;font-weight:600;color:var(--navy)}
.notacard span.tx{display:block;font-size:12.5px;line-height:1.4;margin-top:2px;color:#2B2760}
.prose p{font-size:14.5px;line-height:1.65;margin:0 0 14px;color:#2B2760;font-weight:400}
.prose h3{font-size:15px;font-weight:600;margin:18px 0 8px}
.prose ul{margin:0 0 14px;padding-left:20px;font-size:14.5px;line-height:1.6}
.sec-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sec-row h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap}
.sec-row h3 svg{color:var(--navy)}
.lk{white-space:nowrap;background:none;border:none;color:var(--navy);font-weight:500;font-size:12px;display:inline-flex;align-items:center;gap:6px;padding:6px 0}
.dt{display:flex;align-items:center;gap:14px;padding-top:10px}
.dt .d{width:56px;text-align:center;flex:none;padding-right:16px;border-right:1.5px solid var(--line);margin-right:0}
.dt .d small{display:block;font-size:12px;color:var(--muted)}
.dt .d b{display:block;font-size:29px;font-weight:500;letter-spacing:-1px;line-height:1.05}
.dim{color:var(--muted);font-size:12px}
.kick{font-size:10.5px;font-weight:500;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.bn{height:34px;padding:0 14px;border-radius:17px;border:none;background:#fff;color:var(--ink);font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(40,20,100,.18)}
.bn.g{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.pc{border:none;background:linear-gradient(135deg,#fff,#F4EFFD);border-radius:16px;box-shadow:var(--sh);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:0;position:relative;overflow:hidden;color:var(--ink)}
.pc>*{position:relative;z-index:1}
.pill-tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.7);font-size:10.5px;font-weight:500}
.au-indigo .pill-tag{background:rgba(255,255,255,.12);color:#fff}
.ib{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--ink)}
.c1{background:#EFE8FB}.c2{background:#E6E8FA}.c3{background:#EDE7F6}.c4{background:#F4E9F6}.c5{background:#E8EEF8}
.circle{width:40px;height:40px;border-radius:50%;border:none;background:#fff;box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.au-indigo .circle,.glass{background:rgba(255,255,255,.12);box-shadow:none;color:#fff}
.btn{height:46px;border-radius:23px;border:none;background:var(--navy);color:#fff;font-weight:600;font-size:14px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn.full{width:100%}.btn.sec{background:#fff;color:var(--ink);box-shadow:var(--sh)}.btn.danger{background:#fff;color:var(--alerta);box-shadow:var(--sh)}
.btn:disabled{opacity:.5;cursor:default}
.orb{display:inline-block;width:22px;height:22px;border-radius:50%;flex:none;background:#E9DDB8;box-shadow:inset 0 0 0 4px rgba(31,27,75,.12)}
.seg{display:flex;background:#fff;border-radius:28px;padding:5px;box-shadow:var(--sh);gap:4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;min-width:max-content;height:36px;border-radius:18px;border:none;background:none;font-weight:500;font-size:12px;padding:0 14px;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 18px;border-radius:22px;border:none;background:#fff;box-shadow:var(--sh);font-weight:500;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);color:#fff}
.list{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:none;border-radius:16px;padding:10px 12px;box-shadow:var(--sh);text-decoration:none;color:var(--ink)}
.dots{display:flex;gap:3px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:#E3DCF4}
.dots i.on{background:var(--navy)}
.bar{height:6px;border-radius:3px;background:#E7E1F6;overflow:hidden}.bar>span{display:block;height:100%;border-radius:3px;background:var(--navy)}
.matrix{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:92px}
.matrix .col{display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
.matrix .col i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.16)}
.matrix .col i.on{background:#fff}
.matrix .col.hoje i.on{background:#E9DDB8}
.mlabels{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:10px;font-weight:500;opacity:.85;margin-top:8px}
/* dock flutuante com perspectiva */
.dock-wrap{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:calc(100% - 24px);max-width:416px;perspective:700px;z-index:30;pointer-events:none}
.dock{pointer-events:auto;position:relative;display:flex;align-items:center;justify-content:space-between;gap:2px;padding:6px 10px 8px;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:34px;box-shadow:0 18px 38px -10px rgba(70,50,160,.28),0 1px 4px rgba(70,50,160,.06),inset 0 0 0 1px rgba(85,24,251,.06);transform:rotateX(10deg);transform-origin:50% 100%}
.dock .pin{position:absolute;bottom:6px;left:0;width:30px;height:3.5px;border-radius:2px;background:var(--navy);transition:transform .45s cubic-bezier(.34,1.36,.5,1),opacity .25s;pointer-events:none;z-index:0;opacity:0}
.dock button{position:relative;z-index:1;flex:1;height:48px;border-radius:20px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8B86AA;font-size:10px;font-weight:600;transition:color .3s,transform .2s}
.dock button svg{transition:transform .35s cubic-bezier(.34,1.56,.5,1)}
.dock button.on{color:var(--navy);font-weight:500}
.dock button.on svg{transform:translateY(-1px) scale(1.06)}
.dock button:active{transform:scale(.93)}
.dock .add{flex:none;width:48px;height:48px;border-radius:50%;margin:0 6px;color:#fff;background:linear-gradient(135deg,#7A4BFF,#4410D6);box-shadow:0 8px 18px rgba(68,16,214,.4)}
.dock .add svg{transition:transform .4s cubic-bezier(.34,1.56,.5,1)}
.dock .add svg *{stroke-width:24}
.dock.aberto .add svg{transform:rotate(135deg)}
html{scroll-behavior:smooth}
.enter-fwd{animation:entraF .42s cubic-bezier(.2,.8,.2,1) both}
.enter-back{animation:entraB .42s cubic-bezier(.2,.8,.2,1) both}
.enter-aba{animation:entraA .38s ease-out both}
@keyframes entraF{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes entraB{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes entraA{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(16px) scale(.985);transition:opacity .55s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.overlay{animation:fundo .3s ease both}.sheet{animation:sobe .5s cubic-bezier(.16,1,.3,1) both}
@keyframes fundo{from{opacity:0}to{opacity:1}}@keyframes sobe{from{transform:translateY(105%)}to{transform:none}}
.toast{animation:toast .35s cubic-bezier(.2,.9,.25,1) both}@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
/* topo */
.top{display:flex;align-items:center;gap:10px;padding:16px 18px 4px}
.top h1{font-size:19px;text-align:center;flex:1}
/* rotina */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#fff;border-radius:18px;padding:6px;box-shadow:var(--sh)}
.day{height:52px;border-radius:14px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);padding:0}
.day b{font-size:15.5px;font-weight:600;color:var(--ink)}
.day.on{background:var(--navy);color:#fff}.day.on b{color:#fff}
.day.today:not(.on) b{color:var(--indigo);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.task{display:flex;align-items:center;gap:10px;padding:9px 0}
.task+.task{border-top:1px solid var(--line)}
.check{width:30px;height:30px;border-radius:50%;border:2px solid #D2C9EE;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;padding:0;color:#fff}
.check.on{background:var(--navy);border-color:var(--navy)}
.tag{font-size:10px;font-weight:600;padding:4px 10px;border-radius:10px;background:var(--soft)}
/* formulários */
label.f{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:600}
.input{height:46px;border-radius:14px;border:1.5px solid transparent;padding:0 16px;background:#fff;width:100%;box-shadow:var(--sh)}
textarea.input{height:auto;min-height:96px;padding:14px 16px;line-height:1.45}
.input:focus{outline:none;border-color:var(--indigo)}
.tile .input{box-shadow:none;background:rgba(255,255,255,.85)}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 16px;border-radius:22px;background:#fff;box-shadow:var(--sh);font-size:12px;font-weight:500}
.opt input:checked+span{background:var(--navy);color:#fff}
.opt input:focus-visible+span{outline:2px solid var(--indigo);outline-offset:2px}
.grid-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-opts .opt span{width:100%;height:64px;border-radius:20px}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood .opt span{flex-direction:column;width:100%;height:72px;border-radius:20px;padding:0;gap:2px;font-size:10px}
.mood .opt span i{font-style:normal;font-size:20.5px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.45)}.steps i.on{background:#fff}
.tile.au-sol .steps i.on,.tile.au-menta .steps i.on,.tile.au-ceu .steps i.on,.tile.au-rosa .steps i.on{background:var(--ink)}
/* camadas */
.overlay{position:fixed;inset:0;background:rgba(31,27,75,.38);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:0 10px max(10px,env(safe-area-inset-bottom));transition:opacity .3s ease}
.sheet{background:var(--bg);width:100%;max-width:420px;border-radius:34px;padding:8px 16px 18px;max-height:84vh;overflow:auto;box-shadow:0 24px 60px rgba(22,23,58,.3);touch-action:pan-y;overscroll-behavior:contain;will-change:transform}
.grab-area{padding:6px 0 12px;cursor:grab;touch-action:none}
.grab{width:44px;height:5px;border-radius:3px;background:#D5CCEE;margin:0 auto}
.overlay.saindo{opacity:0}
.overlay.saindo .sheet{transform:translateY(110%) !important;transition:transform .32s cubic-bezier(.4,0,1,1)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:18px;font-size:12px;font-weight:600;z-index:60;max-width:90%;box-shadow:var(--sh)}
.banner{background:#FFF1E6;color:var(--alerta);border-radius:16px;padding:10px 14px;font-size:11px;font-weight:600}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta-grid div{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.meta-grid small{display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.empty{text-align:center;padding:26px 18px;border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid #E3E3DF;border-top-color:var(--navy);animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{font-size:10.5px;color:var(--muted);line-height:1.45}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.link{font-size:12px;font-weight:600;background:none;border:none;padding:8px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.bubble{max-width:86%;padding:12px 15px;border-radius:20px;font-size:13px;line-height:1.45;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:#fff;box-shadow:var(--sh);border-bottom-left-radius:6px}
.composer{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:calc(100% - 28px);max-width:412px;display:flex;gap:8px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);padding:8px;border-radius:32px;box-shadow:0 18px 36px -8px rgba(22,23,58,.25);z-index:30}
.composer input{flex:1;border:none;background:transparent;padding:0 12px;outline:none}
.composer button{width:48px;height:48px;border-radius:24px;border:none;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center}
.scan-frame{position:relative;border-radius:24px;overflow:hidden;background:#1F1B4B;aspect-ratio:3/4;max-height:52vh;margin:0 auto;box-shadow:0 20px 50px rgba(31,27,75,.38)}
.scan-frame img{width:100%;height:100%;object-fit:contain;display:block;filter:saturate(.9) brightness(.95)}
.scan-frame:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.4px);background-size:14px 14px;mix-blend-mode:overlay;z-index:1}
.scan-line{position:absolute;left:0;right:0;height:2px;top:0;z-index:2;background:#E9DDB8;box-shadow:0 0 14px 3px rgba(233,221,184,.75);animation:varre 3.2s ease-in-out infinite}
@keyframes varre{0%{transform:translateY(0)}50%{transform:translateY(calc(52vh - 4px))}100%{transform:translateY(0)}}
.scan-corner{position:absolute;width:30px;height:30px;border:2px solid #E9DDB8;z-index:3}
.scan-corner.a{top:14px;left:14px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}.scan-corner.b{top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.scan-corner.c{bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 12px}.scan-corner.d{bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.scan-badge{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;background:rgba(22,23,58,.72);backdrop-filter:blur(8px);color:#fff;padding:8px 14px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.passo{display:flex;align-items:center;gap:12px;padding:10px 0;opacity:.45;transition:opacity .4s}
.passo.ativo,.passo.ok{opacity:1}
.passo .st{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid #D3D3E3;color:#fff}
.passo.ativo .st{border-color:var(--navy);border-top-color:transparent;animation:spin .9s linear infinite}
.passo.ok .st{background:var(--navy);border-color:var(--navy)}
.termo{padding:12px 0}.termo+.termo{border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.scan-line,.passo.ativo .st{animation:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.spinner,.enter-fwd,.enter-back,.enter-aba,.overlay,.sheet,.toast,.rv{opacity:1;transform:none;transition:none}.dock .pin,.dock button,.dock button svg{transition:none}}
.topbar{display:flex;align-items:center;gap:8px;padding:18px 18px 0}
.topbar .circle{width:38px;height:38px}
.loader{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.pulso{animation:pulso 1.6s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:1;transform:none}}
.bv{min-height:calc(100vh - 20px);display:flex;flex-direction:column;padding:28px 22px 24px}
.bv-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:20px 0}

.app{background:#fff !important;overflow:hidden}
.app:before{content:"";position:absolute;inset:-120px -160px auto -160px;height:1100px;z-index:0;pointer-events:none;
 background:

 filter:blur(40px);opacity:.95}

 box-shadow:0 1px 2px rgba(20,20,40,.04),0 10px 30px -12px rgba(20,20,40,.12) !important;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.au-indigo:before{display:none !important}
.hero-top,.hero-foot{opacity:1 !important;color:var(--muted)}
.hero-track{background:#ECECF0 !important}.hero-track i{background:var(--navy) !important}
.hero-pct{color:var(--navy)}
.bn{background:var(--navy) !important;color:#fff !important;box-shadow:none !important}
.bn.g{background:#F1F1F4 !important;color:var(--ink) !important}
.au-sol,.au-ceu,.au-rosa,.au-menta,.au-lilas{background:#F4F4F6 !important}
.card,.list,.qt,.art,.dc,.pc,.empty,.week,.seg,.meta-grid div,.input,.chip,.opt span,.notacard,.bubble.ai{background:rgba(255,255,255,.88) !important;border:1px solid rgba(20,20,40,.05);box-shadow:0 1px 2px rgba(20,20,40,.03),0 8px 24px -14px rgba(20,20,40,.14) !important}
.qt .qi,.dc .th,.art .th,.ib{background:#F2F2F5 !important;color:var(--ink) !important}
.art .th{color:var(--navy) !important}
.tg,.tag{background:#F2F2F5 !important;color:#4A4A5A !important}
.cat button{background:#fff;border-color:#EAEAEE}
.av{background:#F2F2F5 !important;color:var(--ink) !important}
.dock{background:rgba(255,255,255,.85) !important}


.plan{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.9);border:1.5px solid #E6E3EE;border-radius:16px;padding:12px 14px;font-family:inherit;color:var(--ink);position:relative}
.plan.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(85,24,251,.12)}
.plan .rd{width:20px;height:20px;border-radius:50%;border:2px solid #CFCADF;flex:none;display:flex;align-items:center;justify-content:center}
.plan.on .rd{border-color:var(--navy)}.plan.on .rd:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--navy)}
.plan .badge{position:absolute;top:-9px;right:12px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:8px}
.plus-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;letter-spacing:.2px}
.uso{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:10px}
.uso .bar{flex:1;height:4px}
/* estados selecionados e textos claros sobre cards agora brancos */
.opt input:checked+span,.chip.on{background:var(--navy) !important;color:#fff !important;border-color:var(--navy) !important;box-shadow:0 6px 14px -6px rgba(85,24,251,.5) !important}
.opt input:checked+span svg{color:#fff}
.au-indigo .pill-tag{background:#F1EDFF !important;color:var(--navy) !important}
.au-indigo .circle,.glass{background:#fff !important;color:var(--ink) !important;box-shadow:var(--sh) !important}
.steps i{background:#E4E1EE !important}.steps i.on{background:var(--navy) !important}

async function iniciar() {

TELAS.evolucao = (p) => {
  const trat = S.trat.items; const sel = p.id && trat.find(t => t.id === p.id) ? p.id : "geral"; const t = trat.find(x => x.id === sel);

  const cores = ["#E6E6E2","#D9D9E6","#B7B9D6","#8E91C2","#5D60A6","#2F3273"];

    : `<div class="empty"><span class="ib c3" style="margin:0 auto 10px">${ic("diario", 22)}</span><p class="b">Ainda sem registros</p><p class="small muted" style="margin-top:4px">Registre o dia em 30 segundos.</p></div>`}

TELAS.linha = () => {

async function reduzirImagem(file) { try { const b = await createImageBitmap(file); const k = Math.min(1, 1600 / Math.max(b.width, b.height)); const c = document.createElement("canvas"); c.width = Math.round(b.width * k); c.height = Math.round(b.height * k); c.getContext("2d").drawImage(b, 0, 0, c.width, c.height); return await new Promise(r => c.toBlob(x => r(x || file), "image/jpeg", .85)); } catch (e) { return file; } }
const extrairJSON = t => { const m = String(t || "").match(/\{[\s\S]*\}/); if (!m) throw new Error("sem json"); return JSON.parse(m[0]); };
const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/";
async function carregarPDFJS() {

  const w = await import(PDFJS + "pdf.worker.min.mjs"); globalThis.pdfjsWorker = w;
  const lib = await import(PDFJS + "pdf.min.mjs"); lib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.mjs";
  return (window.__pdfjs = lib);
}
async function pdfParaImagens(file, max = 4) {

  for (let i = 1; i <= Math.min(doc.numPages, max); i++) {
    const pg = await doc.getPage(i); const v1 = pg.getViewport({ scale: 1 }); const vp = pg.getViewport({ scale: Math.min(2.4, 1600 / v1.width) });
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height); const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await pg.render({ canvasContext: ctx, canvas: c, viewport: vp }).promise;
    out.push(await new Promise(r => c.toBlob(r, "image/jpeg", .85)));
  }
  return { imagens: out, paginas: doc.numPages };
}

      S.docs.items.push({ id, tipo: g("tipo") || "outro", titulo: g("titulo"), data: g("data"), profissional: g("profissional"), registro: g("registro"), especialidade: g("especialidade"), origem: g("origem"), assetId, assetIds: ids, mime: LEITURA && LEITURA.files ? LEITURA.files[0].type : "", resumo: r.resumo_simples || "", pontos: r.pontos_principais || [], termos: r.termos || [], recomendacoes: r.recomendacoes || [], perguntas: r.perguntas_para_consulta || [], criadoEm: new Date().toISOString() });
      await salvar("docs").catch(() => {}); LEITURA = null; go("documentos", {}, true); go("doc", { id }); toast("Documento guardado."); }
    if (tipo === "med") { const id = f.dataset.id; S.meds.items = S.meds.items.map(m => m.id === id ? { ...m, nome: g("nome"), dose: g("dose"), horarios: lerHorarios(g("horarios")), inicio: g("inicio"), fim: g("fim") } : m); await salvar("meds").catch(() => {}); voltar(); toast("Remédio atualizado."); }
    if (tipo === "nota") { S.notas.items.push({ id: uid(), data: iso(new Date()), titulo: g("titulo"), texto: g("texto"), para: g("para"), feito: false, origem: "manual" }); fecharSheet(); render(); await salvar("notas").catch(() => {}); toast("Anotação salva."); }
    if (tipo === "tarefa") { S.tarefas.items.push({ id: uid(), titulo: g("titulo"), dias: fd.getAll("dias").map(Number), hora: g("hora") }); fecharSheet(); await salvar("tarefas").catch(() => {}); go("rotina", {}, true); toast("Tarefa adicionada."); }
    if (tipo === "rede") { S.rede.items.push({ id: uid(), nome: g("nome"), papel: g("papel"), contato: g("contato"), obs: g("obs") }); fecharSheet(); render(); salvar("rede").catch(() => {}); toast("Pessoa adicionada."); }
    if (tipo === "chat") { const q = g("q"); if (q) perguntar(q); }
  } finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
});
