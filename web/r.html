<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Resumo para a consulta · Didi</title>
<link rel="icon" href="/icones/icone-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<script src="config.js"></script>
<style>
body{margin:0;background:#F6F4FC;font-family:'Montserrat',system-ui,sans-serif;color:#1F1B3A;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:22px 18px 40px}
.rel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px -14px rgba(20,20,40,.18);font-size:14px;line-height:1.55}
h1{font-size:22px;font-weight:600;margin:14px 0 2px}h2{font-size:12.5px;font-weight:700;margin:20px 0 6px;color:#232428;text-transform:uppercase;letter-spacing:.6px}
table{width:100%;border-collapse:collapse}td{padding:6px 0;border-bottom:1px solid #EEE;vertical-align:top}td:first-child{color:#6E6A8C;width:34%;padding-right:10px}
ul{margin:4px 0;padding-left:18px}.m{color:#6E6A8C;font-size:12.5px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.marca{font-weight:600;color:#232428;font-size:18px;letter-spacing:-.3px}.aviso{margin-top:18px;font-size:11.5px;color:#8A86A6}
.btn{display:inline-block;margin-top:14px;background:#232428;color:#fff;border:none;border-radius:20px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
@media print{body{background:#fff}.rel{box-shadow:none;padding:0}.btn{display:none}}
</style>
</head>
<body><main id="m"><div class="rel"><p>Carregando…</p></div></main>
<script>
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd = s => { if (!s) return ""; const [y, m, d] = String(s).slice(0, 10).split("-"); return `${d}/${m}/${y}`; };
const DIAS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"], HUMOR = ["Difícil","Ruim","Ok","Bom","Ótimo"];
function idade(n) { if (!n) return ""; const a = new Date(n + "T12:00"), h = new Date(); let m = (h.getFullYear() - a.getFullYear()) * 12 + h.getMonth() - a.getMonth(); if (h.getDate() < a.getDate()) m--; const y = Math.floor(m / 12); return y ? `${y} anos e ${m % 12} meses` : `${m} meses`; }
const L = (a, b) => b ? `<tr><td>${a}</td><td>${b}</td></tr>` : "";
async function abrir() {
  const t = new URLSearchParams(location.search).get("t") || ""; const C = window.TEIA_CONFIG || {}; const el = document.getElementById("m");
  if (!t) { el.innerHTML = `<div class="rel"><p>Link incompleto.</p></div>`; return; }
  let d; try { const r = await fetch(`${C.SUPABASE_URL}/functions/v1/resumo-publico?t=${encodeURIComponent(t)}`, { headers: { apikey: C.SUPABASE_ANON_KEY } }); d = await r.json(); if (!r.ok) throw d; }
  catch (e) { el.innerHTML = `<div class="rel"><p><b>Este link não está mais disponível.</b></p><p class="m">Ele pode ter vencido (os links valem 7 dias) ou sido cancelado pela família. Peça um novo.</p></div>`; return; }
  const p = d.pessoa || {}, rg = d.ultimos30 || {};
  el.innerHTML = `<div class="rel"><div class="top"><span class="marca">✦ Didi</span><span class="m">Gerado em ${esc(fd(d.gerado))} · válido até ${esc(fd(d.expira))}</span></div>
  <h1>Resumo de ${esc(p.nome)}</h1><p class="m">Organizado por ${esc(d.quem || "a família")}${d.papel ? " (" + esc(d.papel) + ")" : ""} para a consulta</p>
  <h2>Quem é</h2><table>${L("Nome", esc(p.nome))}${L("Idade", p.nascimento ? esc(idade(p.nascimento)) + " (" + esc(fd(p.nascimento)) + ")" : "")}${L("Diagnósticos", esc(p.diagnosticos))}${L("Plano de saúde", esc(p.plano_saude))}</table>
  <h2>Remédios em uso</h2>${(d.remedios || []).length ? `<table>${d.remedios.map(m => L(esc(m.nome), esc([m.dose, (m.horarios || []).join(", "), m.medico ? "receitado por " + m.medico : "", m.fim ? "até " + fd(m.fim) : "uso contínuo"].filter(Boolean).join(" · ")))).join("")}</table>` : "<p>Nenhum remédio cadastrado.</p>"}
  <h2>Terapias</h2>${(d.terapias || []).length ? `<table>${d.terapias.map(x => L(esc(x.tipo), esc([(x.dias || []).map(i => DIAS[i]).join(", "), x.hora, x.profissional, x.meta ? "meta: " + x.meta : ""].filter(Boolean).join(" · ")))).join("")}</table>` : "<p>Nenhuma terapia cadastrada.</p>"}
  <h2>Últimos 30 dias</h2><table>${L("Dias registrados", String(rg.dias || 0))}${L("Humor médio", rg.humor ? HUMOR[Math.round(rg.humor) - 1] : "")}${L("Sono", rg.dias ? `bom ${rg.sono.Bom}, regular ${rg.sono.Regular}, ruim ${rg.sono.Ruim}` : "")}${L("Crises", rg.dias ? String(rg.crises) + (rg.gatilhos && rg.gatilhos.length ? " · antes: " + esc(rg.gatilhos.map(([g, n]) => `${g} (${n})`).join(", ")) : "") : "")}</table>
  ${(d.marcos || []).length ? `<h2>Conquistas recentes</h2><ul>${d.marcos.map(x => `<li>${esc(x.titulo)} · ${esc(fd(x.data))}</li>`).join("")}</ul>` : ""}
  ${(d.documentos || []).length ? `<h2>Documentos recentes</h2><ul>${d.documentos.map(x => `<li><b>${esc(x.titulo || "Documento")}</b> · ${esc([fd(x.data), x.profissional].filter(Boolean).join(" · "))}${x.resumo && x.tipo !== "receita" ? `<br><span class="m">${esc(x.resumo)}</span>` : ""}</li>`).join("")}</ul>` : ""}
  ${(d.consultas || []).length ? `<h2>Consultas</h2><ul>${d.consultas.map(c => `<li>${esc(fd(c.data))}${c.hora ? " às " + esc(c.hora) : ""} · ${esc(c.titulo)}${c.profissional ? " · " + esc(c.profissional) : ""}</li>`).join("")}</ul>` : ""}
  ${(d.notas || []).length ? `<h2>Para conversar nesta consulta</h2><ul>${d.notas.map(n => `<li><b>${esc(n.titulo)}:</b> ${esc(n.texto)}</li>`).join("")}</ul>` : ""}
  <button class="btn" onclick="print()">Imprimir ou salvar em PDF</button>
  <p class="aviso">Informações organizadas pela família no app Didi. Não substituem a avaliação profissional. Link de leitura, válido por 7 dias.</p></div>`;
  document.title = `Resumo de ${p.nome || ""} · Didi`;
}
abrir();
</script>
</body>
</html>
