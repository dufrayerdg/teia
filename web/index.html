<style>
:root{--bg:#F8F6FE;--card:#fff;--ink:#1F1B4B;--navy:#5518FB;--indigo:#6B3BFF;--sol:#E9DDB8;--muted:#6E6A8C;--soft:#F1EDFB;--line:#ECE7F8;--r:18px;
--sh:0 1px 2px rgba(70,50,160,.04),0 8px 24px rgba(70,50,160,.07);--alerta:#9A3412}
*{box-sizing:border-box}
html,body{margin:0;background:#EEEAF8;color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
a{color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#FFFFFF 0%,#F8F5FE 45%,#EEE8FB 100%);background-attachment:local;position:relative;padding-bottom:128px;overflow-x:clip}
.app>*{position:relative;z-index:1}
h1,h2,h3,p{margin:0}
h1{font-size:23px;font-weight:600;letter-spacing:-.5px;line-height:1.12}
h2{font-size:16.5px;font-weight:600;letter-spacing:-.3px}
h3{font-size:14px;font-weight:600}
.wrap{padding:18px 18px 0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}.xs{font-size:10.5px}.b{font-weight:600}
.num{font-weight:600;letter-spacing:-1px;line-height:1}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.tile{position:relative;overflow:hidden;border-radius:var(--r);padding:14px;box-shadow:var(--sh);isolation:isolate}
.tile>*{position:relative;z-index:1}
.au-indigo{color:#fff;background:linear-gradient(125deg,#7A4BFF 0%,#5518FB 55%,#3A0DBF 100%);border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 28px -14px rgba(58,13,191,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.au-indigo:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;background:linear-gradient(112deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.05) 38%,rgba(255,255,255,0) 60%)}
.au-sol{background:#EFEAFB}
.au-ceu{background:#E8E4FA}
.au-rosa{background:#F3EBF7}
.au-menta{background:#E9EFF6}
.au-lilas{background:#ECE7FA}
.hero{width:100%;text-align:left;cursor:pointer;padding:13px 16px 14px;border-radius:20px;display:block;font-family:inherit}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;font-weight:500;opacity:.82}
.hero-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
.hero-t{font-size:19px;font-weight:500;letter-spacing:-.4px;line-height:1.15}
.hero-pct{font-size:34px;font-weight:300;letter-spacing:-1.5px;line-height:1}
.hero-track{height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin-top:10px;overflow:hidden}
.hero-track i{display:block;height:100%;border-radius:2px;background:#fff}
.hero-foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;opacity:.88;margin-top:7px}
.hd{display:flex;align-items:center;gap:12px;padding:22px 18px 4px}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#E3DAFA,#C8BAF0);color:var(--navy);font-weight:600;font-size:19px;box-shadow:0 0 0 3px #fff}
.hello{font-size:20.5px;font-weight:600;letter-spacing:-.6px;line-height:1.1}
.qts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qt{border:none;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;text-align:left;color:var(--ink);min-height:0}
.qt .qi{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#EEE8FC,#DDD2F8);display:flex;align-items:center;justify-content:center;flex:none;color:var(--navy)}
.cat{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 18px 4px;margin:0 -18px}
.cat::-webkit-scrollbar{display:none}
.cat button{flex:none;height:32px;padding:0 14px;border-radius:16px;border:1px solid #E5DEF6;background:#fff;font-size:12.5px;font-weight:500;color:var(--muted)}
.cat button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.art{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:none;border-radius:14px;padding:10px 12px;box-shadow:var(--sh);color:var(--ink)}
.art .th{width:44px;height:44px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#7A4BFF,#5518FB)}
.art .t{font-size:13.5px;font-weight:500;line-height:1.3}
.art .m{font-size:11.5px;color:var(--muted);margin-top:3px}
.dc{display:flex;gap:12px;width:100%;text-align:left;background:#fff;border:none;border-radius:14px;padding:12px;box-shadow:var(--sh);color:var(--ink);align-items:flex-start;font-family:inherit}
.dc .th{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EEE8FC,#DDD2F8);color:var(--navy)}
.dc .tt{font-size:13.5px;font-weight:500;line-height:1.3}
.dc .mm{font-size:11.5px;color:var(--muted);margin-top:2px}
.dc .sn{font-size:12px;color:#4A466E;margin-top:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tg{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;font-size:10.5px;font-weight:500;background:#F0EBFB;color:var(--navy)}
.tgs{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.nota{display:flex;align-items:flex-start;gap:10px}
.nota.feita{opacity:.55}
.notacard{align-self:flex-start;max-width:90%;display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1px solid #E5DEF6;border-radius:14px;padding:10px 12px;box-shadow:var(--sh);font-family:inherit;color:var(--ink)}
.notacard b{display:block;font-size:12px;font-weight:600;color:var(--navy)}
.notacard span.tx{display:block;font-size:12.5px;line-height:1.4;margin-top:2px;color:#2B2760}
.prose p{font-size:14.5px;line-height:1.65;margin:0 0 14px;color:#2B2760;font-weight:400}
.prose h3{font-size:15px;font-weight:600;margin:18px 0 8px}
.prose ul{margin:0 0 14px;padding-left:20px;font-size:14.5px;line-height:1.6}
.sec-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sec-row h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap}
.sec-row h3 svg{color:var(--navy)}
.lk{white-space:nowrap;background:none;border:none;color:var(--navy);font-weight:500;font-size:12px;display:inline-flex;align-items:center;gap:6px;padding:6px 0}
.dt{display:flex;align-items:center;gap:14px;padding-top:10px}
.dt .d{width:56px;text-align:center;flex:none;padding-right:16px;border-right:1.5px solid var(--line);margin-right:0}
.dt .d small{display:block;font-size:12px;color:var(--muted)}
.dt .d b{display:block;font-size:29px;font-weight:500;letter-spacing:-1px;line-height:1.05}
.dim{color:var(--muted);font-size:12px}
.kick{font-size:10.5px;font-weight:500;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.bn{height:34px;padding:0 14px;border-radius:17px;border:none;background:#fff;color:var(--ink);font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(40,20,100,.18)}
.bn.g{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.pc{border:none;background:linear-gradient(135deg,#fff,#F4EFFD);border-radius:16px;box-shadow:var(--sh);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:0;position:relative;overflow:hidden;color:var(--ink)}

.scan-frame:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.4px);background-size:14px 14px;mix-blend-mode:overlay;z-index:1}

TELAS.documentos = (p) => {

<div class="wrap stack" style="padding-top:8px;gap:12px">

  <div class="cat" role="group" aria-label="Filtrar">${[["todos","Todos"],["laudo","Laudos"],["receita","Receitas"],["exame","Exames"],["relatorio","Relatórios"],["outro","Outros"]].map(([k, l]) => `<button class="${f === k ? "on" : ""}" data-a="doc-filtro" data-v="${k}" aria-pressed="${f === k}">${l}${cont(k) ? ` · ${cont(k)}` : ""}</button>`).join("")}</div>

TELAS.evolucao = (p) => {

  const cores = ["#E6E6E2","#D9D9E6","#B7B9D6","#8E91C2","#5D60A6","#2F3273"];

  <div class="card"><div class="row"><div class="grow"><p class="xs b muted">Últimas 4 semanas</p><p class="b" style="font-size:15.5px">${bons} ${bons === 1 ? "dia bom" : "dias bons"}</p></div><span class="xs muted">por humor registrado</span></div>
    <div role="img" aria-label="Humor registrado nos últimos 28 dias: ${bons} dias bons" style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px">${Array.from({length: 28}, (_, i) => { const dI = iso(addDays(ini, i)); const h = porDia[dI] || 0; return `<span style="aspect-ratio:1;border-radius:50%;background:${cores[h]};${dI === iso(hoje) ? "outline:2px solid #1B1C3A;outline-offset:2px" : ""}"></span>`; }).join("")}</div>
    <div class="row xs muted" style="gap:10px;margin-top:12px;flex-wrap:wrap">${[[1,"Difícil"],[3,"Ok"],[5,"Ótimo"],[0,"Sem registro"]].map(([h, l]) => `<span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:50%;background:${cores[h]};display:inline-block"></i>${l}</span>`).join("")}</div></div>

    : `<div class="empty"><span class="ib c3" style="margin:0 auto 10px">${ic("diario", 22)}</span><p class="b">Ainda sem registros</p><p class="small muted" style="margin-top:4px">Registre o dia em 30 segundos.</p></div>`}

    case "doc-apagar": confirmar("Apagar documento?", "Ele sai da pasta. Não dá para desfazer.", "Apagar", async () => { S.docs.items = S.docs.items.filter(d => d.id !== id); await salvar("docs").catch(() => {}); voltar(); toast("Documento apagado."); }); break;
    case "recs-add": { const d = S.docs.items.find(x => x.id === id); if (!d) break; let n = 0; for (const r of d.recomendacoes || []) { const tipo = (TERAPIAS.find(([nm]) => r.terapia && r.terapia.toLowerCase().includes(nm.split(" ")[0].toLowerCase().slice(0, 5))) || ["Outra"])[0]; if (tipo === "Outra" || !S.trat.items.some(t => t.tipo === tipo)) { S.trat.items.push({ id: uid(), tipo, profissional: "", local: "", dias: [], hora: "", meta: tipo === "Outra" ? r.terapia : "", progresso: 0 }); n++; } } await salvar("trat").catch(() => {}); toast(n ? `${n} tratamento(s) adicionado(s). Defina dias e horários.` : "Já estavam cadastrados."); go("tratamentos"); break; }
    case "trat-novo": fecharSheet(); go("tratform", {}); break;
    case "trat-editar": go("tratform", { id }); break;
    case "trat-apagar": confirmar("Apagar tratamento?", "As sessões saem da rotina.", "Apagar", async () => { S.trat.items = S.trat.items.filter(t => t.id !== id); await salvar("trat").catch(() => {}); go("tratamentos", {}, true); }); break;
    case "evo": TELA.p = { id }; render("aba"); break;
    case "reg-apagar": S.regs.items = S.regs.items.filter(r => r.id !== id); render(); salvar("regs").catch(() => {}); break;
    case "med-mais": { const b = document.getElementById("meds"); b.insertAdjacentHTML("beforeend", medBloco({}, b.querySelectorAll("[data-med]").length)); break; }
    case "med-remover": { if (document.querySelectorAll("[data-med]").length > 1) el.closest("[data-med]").remove(); else toast("A receita precisa de pelo menos um remédio."); break; }
    case "med-editar": go("medform", { id }); break;
    case "med-apagar": confirmar("Tirar da rotina?", "O remédio deixa de aparecer na rotina.", "Tirar", async () => { S.meds.items = S.meds.items.filter(m => m.id !== id); await salvar("meds").catch(() => {}); go("rotina", {}, true); }); break;
    case "tarefa-nova": fecharSheet(); abrirSheet(`<form class="stack" data-f="tarefa"><h2>Nova tarefa</h2><label class="f">O que fazer<input class="input" name="titulo" required placeholder="Ex.: atividade sensorial"></label><fieldset style="border:none;padding:0;margin:0"><legend class="small b" style="margin-bottom:8px">Dias</legend><div class="chips">${[1,2,3,4,5,6,0].map(d => `<label class="opt"><input type="checkbox" name="dias" value="${d}" checked><span>${DIAS[d]}</span></label>`).join("")}</div></fieldset><label class="f">Horário (opcional)<input class="input" type="time" name="hora"></label><button class="btn full" type="submit">Adicionar à rotina</button><button class="btn sec full" type="button" data-a="fechar">Cancelar</button></form>`, "Nova tarefa"); break;
    case "tarefa-apagar": S.tarefas.items = S.tarefas.items.filter(t => t.id !== id); render(); salvar("tarefas").catch(() => {}); break;
    case "rede-novo": if (!plus()) { paywall("rede"); break; } abrirSheet(`<form class="stack" data-f="rede"><h2>Adicionar pessoa</h2><label class="f">Nome<input class="input" name="nome" required></label><label class="f">Papel<select class="input" name="papel">${["Pai","Mãe","Avó/Avô","Babá","Irmão/Irmã","Professor(a)","Profissional","Outro"].map(x => `<option>${x}</option>`).join("")}</select></label><label class="f">Contato (opcional)<input class="input" name="contato" placeholder="Telefone ou e-mail"></label><label class="f">Observação (opcional)<input class="input" name="obs"></label><button class="btn full" type="submit">Adicionar</button><button class="btn sec full" type="button" data-a="fechar">Cancelar</button></form>`, "Adicionar pessoa"); break;
    case "rede-apagar": S.rede.items = S.rede.items.filter(r => r.id !== id); render(); salvar("rede").catch(() => {}); break;
    case "relatorio": if (!plus()) { paywall("relatorio"); break; } await gerarRelatorio(el); break;
    case "perguntar": perguntar(v); break;
    case "plus-plano": TELA.p = { ...TELA.p, plano: v }; render(); break;
    case "plus-assinar": if (SB) { const { error } = await SB.functions.invoke("assinatura", { body: { acao: "assinar", ciclo: v } }); if (error) { toast("O pagamento ainda não está disponível."); break; } await atualizarPlano(); } else S.plano = { ...S.plano, plus: true, ciclo: v, desde: iso(new Date()) }; voltar(); toast("Bem-vinda ao teia+!"); break;
    case "plus-cancelar": if (SB) { const { error } = await SB.functions.invoke("assinatura", { body: { acao: "cancelar" } }); if (error) { toast("Não consegui cancelar agora."); break; } await atualizarPlano(); } else S.plano = { ...S.plano, plus: false }; render(); toast("Assinatura cancelada."); break;
    case "manual": TELA = { nome: v === "receita" ? "confreceita" : "conflaudo", p: { r: {} } }; render("fwd"); break;
    case "copiar": try { await navigator.clipboard.writeText(document.getElementById("reltxt").textContent); toast("Copiado."); } catch (err) { toast("Não consegui copiar. Selecione o texto."); } break;
    case "apagar-tudo": confirmar("Apagar todos os dados?", "Perfil, rotina, tratamentos, documentos, arquivos e registros serão apagados. Não dá para desfazer.", "Apagar tudo", async () => {
      if (SB && USER) { try { const { data: arqs } = await SB.storage.from("documentos").list(USER.id, { limit: 1000 }); if (arqs && arqs.length) await SB.storage.from("documentos").remove(arqs.map(f => `${USER.id}/${f.name}`));
        for (const t of ["marcacoes", ...Object.values(MAPA).map(m => m[0]), "perfis"]) { const { error } = await SB.from(t).delete().eq("user_id", USER.id); if (error) throw error; } } catch (e) { toast("Não consegui apagar tudo. Tente de novo."); return; } }
      for (const k of Object.keys(SINC)) delete SINC[k]; S.perfil = null; for (const n of Object.keys(MAPA)) S[n] = { items: [] }; S.checks = { d: {} }; CHAT = []; go("boasvindas", {}, true); toast("Tudo apagado."); }); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.a === "busca") { TELA.p = { ...TELA.p, q: e.target.value }; const pos = e.target.selectionStart; render(); const b = document.getElementById("busca"); if (b) { b.focus(); try { b.setSelectionRange(pos, pos); } catch (er) {} } }
  if (e.target.dataset.a === "range") { const o = document.getElementById("progout"); if (o) o.textContent = e.target.value + "%"; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("layer").innerHTML) fecharSheet(); });

async function gerarRelatorio(btn) {
  const out = document.getElementById("relout"); if (!out) return;
  if (!SAMPLE) { out.innerHTML = `<p class="banner">O resumo com IA não está disponível nesta visualização.</p>`; return; }
  const ref = new Date(), mes = `${ref.getFullYear()}-${pad(ref.getMonth() + 1)}`;
  const regs = S.regs.items.filter(r => r.data.startsWith(mes)).map(r => ({ data: r.data, humor: HUMOR[(r.humor || 3) - 1][1], sono: r.sono, crise: r.crise, conquista: r.conquista, nota: r.nota, terapia: (S.trat.items.find(t => t.id === r.tratId) || {}).tipo }));
  const sess = S.trat.items.map(t => ({ terapia: t.tipo, ...sessoesMes(t), meta: t.meta, progresso: t.progresso }));
  if (!regs.length && !sess.length) { out.innerHTML = `<p class="banner">Registre alguns dias ou cadastre tratamentos para gerar o resumo.</p>`; return; }
  btn.disabled = true; out.innerHTML = `<div class="card stack" style="gap:12px"><p id="reltxt" class="small" style="white-space:pre-wrap;line-height:1.5">Escrevendo o resumo…</p><button class="btn sec" data-a="copiar">Copiar resumo</button></div>`;
  const prompt = `Escreva em português do Brasil um resumo curto (até 170 palavras) do mês de ${MESES[ref.getMonth()]} da criança ${nomeCrianca()}, para a mãe levar às terapeutas. Tom acolhedor e objetivo. Organize em: Presença nas terapias; Como foram os dias; Conquistas; Pontos para conversar. Sem diagnósticos nem recomendações clínicas. Use só os dados abaixo.\nSessões: ${JSON.stringify(sess)}\nRegistros: ${JSON.stringify(regs)}`;
  try { const r = await ia("resumo", { sessoes: sess }); const el = document.getElementById("reltxt"); if (el && r && r.texto) el.textContent = r.texto; }
  catch (err) { if (err && err.code === "limite") { paywall("relatorio"); return; } out.innerHTML = `<p class="banner">${err && err.code === "rate_limited" ? "Muitos pedidos seguidos. Tente em alguns minutos." : "Não consegui gerar o resumo agora."}</p>`; }
  btn.disabled = false;
}

/* ---------- Formulários ---------- */
const lerHorarios = s => String(s || "").split(/[,;\s]+/).map(x => x.trim()).filter(Boolean).map(x => { const m = x.match(/^(\d{1,2})(?:[:hH](\d{2}))?$/); return m ? `${pad(Math.min(23, +m[1]))}:${m[2] || "00"}` : null; }).filter(Boolean);
document.addEventListener("submit", async e => {
  const f = e.target, tipo = f.dataset.f; if (!tipo) return; e.preventDefault();
  const fd = new FormData(f), g = k => (fd.get(k) || "").toString().trim();
  const btn = f.querySelector('[type="submit"]'); if (btn) btn.disabled = true;
  try {
    if (tipo === "entrar") { const email = g("email").toLowerCase(); const { error } = await SB.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } }); if (error) { toast(error.status === 429 ? "Muitas tentativas. Espere um minuto." : "Não consegui enviar o link. Confira o e-mail."); return; } TELA.p = { enviado: true, email }; render(); return; }
    if (tipo === "cad") { const s = Number(f.dataset.step);
      if (s === 1) CAD.mae = g("mae"); if (s === 2) { CAD.crianca = g("crianca"); CAD.nascimento = g("nascimento"); }
      if (s < 3) { TELA.p = { step: s + 1, novo: true }; render("fwd"); return; }
      CAD.diag = fd.getAll("diag"); CAD.plano = g("plano");
      S.perfil = { mae: CAD.mae, crianca: CAD.crianca, nascimento: CAD.nascimento, diagnosticos: CAD.diag.join(", "), plano: CAD.plano, consent: true, consentEm: new Date().toISOString() };
      await salvar("perfil").catch(() => {}); go("inicio", {}, true); toast("Seu espaço está pronto."); }
    if (tipo === "perfil-editar") { S.perfil = { ...S.perfil, mae: g("mae"), crianca: g("crianca"), nascimento: g("nascimento"), diagnosticos: g("diagnosticos"), plano: g("plano") }; await salvar("perfil").catch(() => {}); voltar(); toast("Perfil salvo."); }
    if (tipo === "trat") { const item = { tipo: g("tipo"), profissional: g("profissional"), local: g("local"), dias: fd.getAll("dias").map(Number), hora: g("hora"), meta: g("meta"), progresso: Number(g("progresso") || 0) }; const id = f.dataset.id; if (id) S.trat.items = S.trat.items.map(t => t.id === id ? { ...t, ...item } : t); else S.trat.items.push({ id: uid(), ...item }); await salvar("trat").catch(() => {}); voltar(); toast("Tratamento salvo."); }
    if (tipo === "registro") { S.regs.items.push({ id: uid(), data: g("data"), humor: Number(g("humor") || 3), sono: g("sono"), crise: g("crise") === "Sim", tratId: g("tratId"), conquista: g("conquista"), nota: g("nota") }); if (S.regs.items.length > 900) S.regs.items = S.regs.items.slice(-900); await salvar("regs").catch(() => {}); go("evolucao", {}, true); toast("Registro salvo."); }
    if (tipo === "receita") { const r = (TELA.p && TELA.p.r) || {}; const ids = LEITURA && LEITURA.assetP ? await LEITURA.assetP : []; const assetId = ids[0] || null; const docId = uid(), meds = [];
      for (const fs of f.querySelectorAll("[data-med]")) { const q = n => (fs.querySelector(`[name="${n}"]`) || {}).value || ""; const nome = q("nome").trim(); if (!nome) continue; const dias = Number(q("dias")); meds.push({ id: uid(), nome, dose: q("dose").trim(), horarios: lerHorarios(q("horarios")), inicio: iso(new Date()), fim: dias > 0 ? iso(addDays(new Date(), dias - 1)) : "", receitaId: docId, medico: g("medico") }); }
      if (!meds.length) { toast("Adicione pelo menos um remédio."); return; }
      S.meds.items.push(...meds); S.docs.items.push({ id: docId, tipo: "receita", titulo: "Receita — " + meds.map(m => m.nome).join(", ").slice(0, 60), data: g("data") || iso(new Date()), profissional: g("medico"), registro: g("registro"), especialidade: g("especialidade"), origem: g("origem"), assetId, assetIds: ids, mime: LEITURA && LEITURA.files && LEITURA.files[0] ? LEITURA.files[0].type : "", resumo: r.resumo_simples || "", perguntas: r.perguntas_para_consulta || [], medicamentos: meds.map(m => { const o = (r.medicamentos || []).find(x => x && String(x.nome || "").toLowerCase() === m.nome.toLowerCase()) || {}; return { nome: m.nome, dose: m.dose, horarios: m.horarios, instrucoes: o.instrucoes || "", dias: o.duracao_dias || null }; }), criadoEm: new Date().toISOString() });
      await salvar("meds").catch(() => {}); await salvar("docs").catch(() => {}); LEITURA = null; go("rotina", {}, true); toast(`${meds.length} remédio(s) na rotina.`); }
    if (tipo === "laudo") { const ids = LEITURA && LEITURA.assetP ? await LEITURA.assetP : []; const assetId = ids[0] || null; const r = (TELA.p && TELA.p.r) || {}; const id = uid();
      S.docs.items.push({ id, tipo: g("tipo") || "outro", titulo: g("titulo"), data: g("data"), profissional: g("profissional"), registro: g("registro"), especialidade: g("especialidade"), origem: g("origem"), assetId, assetIds: ids, mime: LEITURA && LEITURA.files ? LEITURA.files[0].type : "", resumo: r.resumo_simples || "", pontos: r.pontos_principais || [], termos: r.termos || [], recomendacoes: r.recomendacoes || [], perguntas: r.perguntas_para_consulta || [], criadoEm: new Date().toISOString() });
      await salvar("docs").catch(() => {}); LEITURA = null; go("documentos", {}, true); go("doc", { id }); toast("Documento guardado."); }
    if (tipo === "med") { const id = f.dataset.id; S.meds.items = S.meds.items.map(m => m.id === id ? { ...m, nome: g("nome"), dose: g("dose"), horarios: lerHorarios(g("horarios")), inicio: g("inicio"), fim: g("fim") } : m); await salvar("meds").catch(() => {}); voltar(); toast("Remédio atualizado."); }
    if (tipo === "nota") { S.notas.items.push({ id: uid(), data: iso(new Date()), titulo: g("titulo"), texto: g("texto"), para: g("para"), feito: false, origem: "manual" }); fecharSheet(); render(); await salvar("notas").catch(() => {}); toast("Anotação salva."); }
    if (tipo === "tarefa") { S.tarefas.items.push({ id: uid(), titulo: g("titulo"), dias: fd.getAll("dias").map(Number), hora: g("hora") }); fecharSheet(); await salvar("tarefas").catch(() => {}); go("rotina", {}, true); toast("Tarefa adicionada."); }
    if (tipo === "rede") { S.rede.items.push({ id: uid(), nome: g("nome"), papel: g("papel"), contato: g("contato"), obs: g("obs") }); fecharSheet(); render(); salvar("rede").catch(() => {}); toast("Pessoa adicionada."); }
    if (tipo === "chat") { const q = g("q"); if (q) perguntar(q); }
  } finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
});
iniciar();
</script>
